name: Sega CD synthetic checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  synthetic:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Initialize the pinned Genesis and CPU sources
        run: |
          git submodule update --init external/segagenesisrecomp
          git -C external/segagenesisrecomp submodule update --init external/m68k-recomp-core external/z80-recomp-core
      - name: Build and run synthetic checks
        run: |
          cmake -S . -B build
          cmake --build build --config Release --parallel 2
          ctest --test-dir build -C Release --output-on-failure --timeout 0
